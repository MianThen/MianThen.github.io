# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Quant Notes
subtitle: '量化系统与高性能计算笔记'
description: '记录量化交易系统中的一线工程实践：定点数、回测引擎、C++ 性能优化。'
keywords: 量化交易,回测引擎,C++,定点数,低延迟
author: Zhuanz
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://mianthen.github.io
permalink: :year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
tag_map:

meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

include:
exclude:
ignore:

# Extensions
theme: butterfly

# Deployment
deploy:
  type: ''

# Search（供 hexo-generator-searchdb 使用）
search:
  path: search.xml
  field: post
  content: true
  format: html
